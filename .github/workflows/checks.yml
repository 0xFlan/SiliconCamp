name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The fixtures are the real tables an M4 build produced, so this proves the
      # checker still understands Project Mu's output and still rejects mutated
      # tables. It needs no firmware build and no Apple hardware.
      - name: ACPI checker regression tests
        run: python3 -m unittest discover -s tests -v

      # The vGIC contract is checked against the patch series, which is the
      # artifact the repository ships, so this job needs no submodule and no
      # compiler. It fails if a patch stops adding a fix or starts re-adding the
      # defect that fix removed.
      - name: vGIC guest contract
        run: ./scripts/check-vgic.py

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "all scripts parse"

  patch-applicability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Top-level submodules only.  MU_BASECORE is 337 MB, and its NASM
          # patch is checked by the same script locally; this job still fails
          # if the ntasp-firmware 0001 or any m1n1-windows patch stops
          # applying to its pinned commit.
          submodules: true

      - name: Patches still apply to the pinned submodules
        run: ./scripts/verify-patches.sh

      # The vGIC checker's structural pass needs real sources, so the series is
      # applied to the checked-out submodule first. This is the mode that catches
      # a defect the line-oriented patch pass cannot see, such as which of two
      # identical-looking aic_set_mask() sites masks and which unmasks.
      - name: Apply the m1n1-windows patches
        run: ./scripts/apply-patches.sh

      - name: vGIC guest contract on the patched sources
        run: ./scripts/check-vgic.py --tree third_party/m1n1-windows

      # The ANS driver lives in the firmware tree, which the platform patch
      # adds, so the patch has to be applied before its constants can be
      # compared with the m1n1 sources they were ported from.
      - name: Apply the firmware platform patch
        run: ./scripts/apply-ntasp-patches.sh

      # The ANS driver is a port of m1n1's nvme.c/asc.c/sart.c/rtkit.c.  Every
      # register offset and bit position in it is compared against those files,
      # so a submodule bump that moves a register fails here instead of on
      # hardware, where a wrong offset is an unrecoverable hang.
      - name: ANS2 driver constants agree with m1n1
        run: ./scripts/check-ans2-constants.py

      # The suite skips two ANS2 tests when the firmware tree is absent; here it
      # is present and patched, so those paths run too.
      - name: Checker regression tests with the patched firmware tree
        run: python3 -m unittest discover -s tests
