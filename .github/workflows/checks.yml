name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The fixtures are the real tables an M4 build produced, so this proves the
      # checker still understands Project Mu's output and still rejects mutated
      # tables. It needs no firmware build and no Apple hardware.
      - name: ACPI checker regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Python syntax
        run: python3 -m py_compile scripts/*.py tests/*.py

      - name: Shell syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" || exit 1
          done
          echo "all scripts parse"

  patch-applicability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Top-level submodules only.  MU_BASECORE is 337 MB, and its NASM
          # patch is checked by the same script locally; this job still fails
          # if the ntasp-firmware 0001 or either m1n1-windows patch stops
          # applying to its pinned commit.
          submodules: true

      - name: Patches still apply to the pinned submodules
        run: ./scripts/verify-patches.sh

      # The ANS driver is a port of m1n1's nvme.c/asc.c/sart.c/rtkit.c.  Every
      # register offset and bit position in it is compared against those files,
      # so a submodule bump that moves a register fails here instead of on
      # hardware, where a wrong offset is an unrecoverable hang.
      - name: ANS2 driver constants agree with m1n1
        run: ./scripts/check-ans2-constants.py

  # Applying a patch is not the same as the patched tree compiling.  This job
  # builds the hypervisor from a clean checkout plus the three m1n1-windows
  # patches, on a machine that has never seen this project's macOS toolchain.
  m1n1-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the pinned m1n1-windows submodule
        run: git submodule update --init --depth 1 third_party/m1n1-windows

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          rustup target add aarch64-unknown-none-softfloat

      - name: Apply the m1n1-windows patches
        run: ./scripts/apply-patches.sh

      - name: Build the raw hypervisor image
        run: make -C third_party/m1n1-windows -j"$(nproc)" build/m1n1.bin

      # A build that produces no image is not a build.  The Mach-O form is
      # deliberately not requested here: it needs ld64.lld and is only used on
      # the macOS side.
      - name: Check the image exists
        run: |
          test -s third_party/m1n1-windows/build/m1n1.bin
          ls -l third_party/m1n1-windows/build/m1n1.bin
